apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    cattle.io/creator: norman
    workload.user.cattle.io/workloadselector: deployment-mutil-agent-chatdata-fe
  name: chatdata-fe
  namespace: 	mutil-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: deployment-mutil-agent-chatdata-fe
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: deployment-mutil-agent-chatdata-fe
    spec:
      containers:
        - image: 192.168.6.126:8098/mutil-agent-chatdata-fe:<BUILD_TAG>
          imagePullPolicy: Always
          name: trino-server
          ports:
            - containerPort: 9000
              protocol: TCP